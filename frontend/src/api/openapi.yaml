openapi: "3.0.3"
info:
  title: Bolt Abacus API
  version: "1.0.0"
  description: >
    API contract for the Bolt Abacus learning platform.
    Frontend mocks via MSW in dev; backend must implement all endpoints to spec.
    Any deviation from this spec requires a spec PR before implementation changes.

servers:
  - url: /api/v1
    description: Vite dev proxy (localhost:8000) and production base

# ── Security ────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DailyQuest:
      type: object
      required: [id, date, timezone, level_name, level_order, lesson_name, lesson_order, target, progress, state, session_id, xp_earned, completed_at]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date, description: "Pinned local assignment date; late completion keeps this date." }
        timezone: { type: string, description: "IANA zone pinned at first successful assignment, UTC fallback." }
        level_name: { type: string }
        level_order: { type: integer }
        lesson_name: { type: string }
        lesson_order: { type: integer }
        target: { type: integer, enum: [5] }
        progress: { type: integer, minimum: 0, maximum: 5, description: "Distinct server-accepted non-skip answers, including mistakes." }
        state: { type: string, enum: [available, in_progress, completed] }
        session_id: { type: string, format: uuid, nullable: true }
        xp_earned: { type: integer, nullable: true, minimum: 0, description: "Existing session XP; no added daily bonus." }
        completed_at: { type: string, format: date-time, nullable: true }

    TodayDailyQuest:
      type: object
      required: [server_now, timezone, reset_at, mission, previous_unfinished, reason]
      properties:
        server_now: { type: string, format: date-time }
        timezone: { type: string }
        reset_at: { type: string, format: date-time, description: "Next local midnight, including DST." }
        mission:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/DailyQuest" }]
        previous_unfinished:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/DailyQuest" }]
        reason: { type: string, nullable: true }

    User:
      type: object
      required: [id, email, role]
      properties:
        id:        { type: string }
        email:     { type: string, format: email }
        role:      { type: string, enum: [STUDENT, GUARDIAN, TEACHER, ADMIN] }
        profile:
          nullable: true
          type: object
          properties:
            display_name: { type: string }
            avatar_url:   { type: string }
            locale:       { type: string }
            timezone:     { type: string }
        stats:
          type: object
          properties:
            total_xp:          { type: integer }
            streak_days:       { type: integer }
            levels_completed:  { type: integer }
            current_level:     { type: integer }

    XpProgressData:
      type: object
      required: [total_xp, current_level, streak_days, current_level_threshold, next_level_threshold, xp_to_next_level]
      properties:
        total_xp:                { type: integer }
        current_level:           { type: integer }
        streak_days:             { type: integer }
        current_level_threshold: { type: integer }
        next_level_threshold:    { type: integer }
        xp_to_next_level:        { type: integer }

    Level:
      type: object
      required: [id, order, name, description, xp_threshold, is_advanced, is_locked, is_completed]
      properties:
        id:           { type: string }
        order:        { type: integer }
        name:         { type: string }
        description:  { type: string }
        xp_threshold: { type: integer }
        is_advanced:  { type: boolean }
        is_locked:    { type: boolean }
        is_completed: { type: boolean }

    LessonWithCompletion:
      type: object
      required: [id, order, name, description, classwork_completed, homework_completed, is_locked]
      properties:
        id:                    { type: string }
        order:                 { type: integer }
        name:                  { type: string }
        description:           { type: string }
        classwork_completed:   { type: boolean }
        classwork_accuracy_pct:
          type: number
          nullable: true
        homework_completed:    { type: boolean }
        is_locked:             { type: boolean }

    SessionQuestion:
      type: object
      required: [index, text, operation]
      properties:
        index:     { type: integer }
        text:      { type: string, description: "Display text for the question (formatted math)" }
        operation: { type: string, enum: [ADD, SUB, MUL, DIV] }

    SessionMeta:
      type: object
      required: [session_id, kind, questions, time_limit_sec]
      properties:
        daily_quest:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/DailyQuest" }]
        session_id:     { type: string }
        kind:           { type: string, enum: [CLASSWORK, HOMEWORK, FLASH_CARDS, ZEN, TIME_ATTACK, CUSTOM] }
        questions:      { type: array, items: { $ref: "#/components/schemas/SessionQuestion" } }
        time_limit_sec: { type: integer, description: "0 means no time limit" }
        is_test_mode: { type: boolean }
        flash_speed_ms: { type: integer, nullable: true }
        attempt_contract_version: { type: integer, enum: [1, 2], description: "Version 1 denotes legacy nullable identities that cannot safely resume via v2." }
        state: { type: string, enum: [active, submitted, abandoned] }
        started_at: { type: string, format: date-time }
        server_now: { type: string, format: date-time }
        lesson_id: { type: string, nullable: true }
        level_id: { type: string, nullable: true }
        question_states:
          type: array
          items: { $ref: "#/components/schemas/QuestionState" }

    AttemptVerdict:
      type: object
      required: [question_index, is_correct, xp_delta]
      properties:
        question_index: { type: integer }
        is_correct:     { type: boolean }
        xp_delta:       { type: integer }

    AttemptIdentity:
      type: object
      required: [question_index, attempt_number]
      properties:
        question_index: { type: integer, minimum: 0, maximum: 32767 }
        attempt_number: { type: integer, minimum: 1, maximum: 32767 }

    AttemptInputV2:
      allOf:
        - $ref: "#/components/schemas/AttemptIdentity"
        - type: object
          required: [answer, elapsed_ms]
          properties:
            answer: { type: integer, minimum: -2147483648, maximum: 2147483647 }
            elapsed_ms: { type: integer, minimum: 0, maximum: 2147483647 }
            is_skip: { type: boolean }

    LegacyAttemptInput:
      type: object
      description: Absent-version compatibility payload; legacy identities are server allocated.
      required: [question_index, answer, elapsed_ms]
      not: { required: [contract_version] }
      properties:
        question_index: { type: integer }
        answer: { type: integer }
        elapsed_ms: { type: integer }
        attempt_number: { type: integer, description: "Old practice may send zero-based counters; these are not v2 identities." }
        is_skip: { type: boolean }

    SingleAttemptRequestV2:
      allOf:
        - { $ref: "#/components/schemas/AttemptInputV2" }
        - type: object
          required: [contract_version]
          properties:
            contract_version: { type: integer, enum: [2] }

    AttemptReceipt:
      allOf:
        - $ref: "#/components/schemas/AttemptVerdict"
        - $ref: "#/components/schemas/AttemptIdentity"
        - type: object
          required: [contract_version, accepted, submitted_answer, elapsed_ms, is_skip]
          properties:
            contract_version: { type: integer, enum: [2] }
            accepted: { type: boolean, enum: [true] }
            submitted_answer: { type: integer }
            elapsed_ms: { type: integer }
            is_skip: { type: boolean }

    QuestionState:
      type: object
      required: [question_index, max_attempt_number, attempt_count, terminal, latest_receipt]
      properties:
        question_index: { type: integer }
        max_attempt_number: { type: integer, minimum: 0, maximum: 32767 }
        attempt_count: { type: integer, minimum: 0 }
        terminal: { type: boolean }
        latest_receipt:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/AttemptReceipt" }]

    RecoveryError:
      type: object
      required: [code, detail]
      properties:
        code: { type: string, enum: [invalid_attempt, duplicate_identity, identity_conflict, attempt_limit, session_closed, pending_attempts, unsupported_contract] }
        detail: { type: string }
        receipt: { $ref: "#/components/schemas/AttemptReceipt" }
        missing_attempts:
          type: array
          items: { $ref: "#/components/schemas/AttemptIdentity" }
        items:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              question_index: { type: integer }
              attempt_number: { type: integer }
              code: { type: string }
              detail: { type: string }

    ProgressRecord:
      type: object
      required: [id, session_id, score_correct, score_total, accuracy_pct, time_taken_sec, xp_earned, created_at]
      properties:
        id:              { type: string }
        session_id:      { type: string }
        score_correct:   { type: integer }
        score_total:     { type: integer }
        accuracy_pct:    { type: number }
        time_taken_sec:  { type: integer }
        xp_earned:       { type: integer }
        created_at:      { type: string, format: date-time }
        contract_version: { type: integer, enum: [2], description: "Present on successful v2 finalize responses." }

    QuestionAttempt:
      type: object
      required: [question_index, attempt_number, question_text, expected_answer, submitted_answer, is_correct, elapsed_ms]
      properties:
        question_index:   { type: integer }
        attempt_number:   { type: integer }
        question_text:    { type: string }
        expected_answer:  { type: integer }
        submitted_answer: { type: integer }
        is_correct:       { type: boolean }
        elapsed_ms:       { type: integer }

    QuestionVerdict:
      type: string
      enum: [correct, wrong, fixed, skipped, unanswered]

    SessionReport:
      type: object
      required: [progress, attempts, question_verdicts]
      properties:
        progress:
          $ref: "#/components/schemas/ProgressRecord"
        attempts:
          type: array
          items: { $ref: "#/components/schemas/QuestionAttempt" }
        lesson_id:
          type: string
          nullable: true
        question_verdicts:
          type: object
          additionalProperties: { $ref: "#/components/schemas/QuestionVerdict" }
          description: "Map of question_index → verdict"

security:
  - BearerAuth: []

# ── Paths ────────────────────────────────────────────────────────────────────
paths:
  /daily-quests/today/:
    get:
      summary: Resolve today's student mission
      description: >
        Authenticated active students only. Lazily freezes one mission per server-derived
        pinned local date, without starting a session or awarding XP. No request overrides.
        Missing eligible content yields a successful null mission with reason.
      responses:
        "200":
          description: Private mission state; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TodayDailyQuest" }
        "401": { description: Authentication required }
        "403": { description: Active student role required }

  /daily-quests/{mission_id}/start/:
    post:
      summary: Start or resume the owned mission's single session
      description: >
        Creates one untimed five-question ZEN session using existing frozen template config.
        Every retry returns that same session, including a completed session. No client
        configuration/date/owner/reward overrides. One accepted non-skip try per question.
      parameters:
        - name: mission_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: New owned mission session; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionMeta" }
        "200":
          description: Existing mission session; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionMeta" }
        "400": { description: Frozen mission content unavailable }
        "401": { description: Authentication required }
        "403": { description: Active student role required }
        "404": { description: Mission absent or owned by another student }

  /auth/login/:
    post:
      summary: Authenticate a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string }
      responses:
        200:
          description: Access token returned; refresh token set as httpOnly cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  access: { type: string }
        401:
          description: Invalid credentials

  /auth/register/:
    post:
      summary: Register a new student account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email:        { type: string, format: email }
                password:     { type: string }
                display_name: { type: string }
      responses:
        201:
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /auth/refresh/:
    post:
      summary: Refresh the access token using the httpOnly refresh cookie
      security: []
      responses:
        200:
          content:
            application/json:
              schema:
                type: object
                properties:
                  access: { type: string }
        401:
          description: Refresh token expired or invalid

  /auth/me/:
    get:
      summary: Get the authenticated user
      responses:
        200:
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /auth/me/xp-progress/:
    get:
      summary: Get XP progress for the authenticated user
      responses:
        200:
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XpProgressData" }

  /auth/me/profile/:
    patch:
      summary: Update display name or avatar
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                avatar_url:   { type: string }
      responses:
        204:
          description: Profile updated

  /auth/avatar-presets/:
    get:
      summary: List available avatar image URLs
      responses:
        200:
          content:
            application/json:
              schema:
                type: object
                properties:
                  presets:
                    type: array
                    items: { type: string }

  /levels/:
    get:
      summary: List all levels with per-user unlock status
      responses:
        200:
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Level" }

  /levels/{id}/:
    get:
      summary: Get a single level
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Level" }
        404:
          description: Level not found

  /levels/{levelId}/lessons/:
    get:
      summary: List lessons for a level with per-user completion state
      parameters:
        - name: levelId
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LessonWithCompletion" }

  /levels/{levelId}/classwork/start/:
    post:
      summary: Start a classwork session for a level (no specific lesson)
      parameters:
        - name: levelId
          in: path
          required: true
          schema: { type: string }
      responses:
        201:
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionMeta" }

  /levels/{levelId}/lessons/{lessonId}/classwork/start/:
    post:
      summary: Start a classwork session for a specific lesson
      parameters:
        - name: levelId
          in: path
          required: true
          schema: { type: string }
        - name: lessonId
          in: path
          required: true
          schema: { type: string }
      responses:
        201:
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionMeta" }

  /practice/start/:
    post:
      summary: Start a practice session (arena mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, operation, digits, rows, question_count, time_limit_sec]
              properties:
                mode:           { type: string, enum: [FLASH_CARDS, ZEN, TIME_ATTACK, CUSTOM] }
                operation:      { type: string, enum: [ADD, SUB, MUL, DIV, MIXED] }
                digits:         { type: integer, minimum: 1, maximum: 4 }
                rows:           { type: integer, minimum: 1, maximum: 6 }
                question_count: { type: integer, minimum: 5, maximum: 100 }
                time_limit_sec: { type: integer, description: "0 = no limit (Zen)" }
      responses:
        201:
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionMeta" }

  /sessions/{sessionId}/:
    get:
      summary: Get active session metadata
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionMeta" }

  /sessions/{sessionId}/attempts/:
    post:
      summary: Submit an answer; v2 stable identity is replay-safe, absent version is legacy
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "#/components/schemas/LegacyAttemptInput" }
                - { $ref: "#/components/schemas/SingleAttemptRequestV2" }
      responses:
        200:
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: "#/components/schemas/AttemptVerdict" }
                  - { $ref: "#/components/schemas/AttemptReceipt" }
        400:
          description: Invalid input or unsupported explicit version
        409:
          description: Conflicting identity, terminal question or closed session

  /sessions/{sessionId}/attempts/bulk/:
    post:
      summary: Atomic v2 batch; legacy absent-version behavior is retained during rollout
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [contract_version, attempts]
                  properties:
                    contract_version: { type: integer, enum: [2] }
                    attempts:
                      type: array
                      maxItems: 100
                      items: { $ref: "#/components/schemas/AttemptInputV2" }
                - type: object
                  required: [attempts]
                  not: { required: [contract_version] }
                  properties:
                    attempts:
                      type: array
                      items: { $ref: "#/components/schemas/LegacyAttemptInput" }
      responses:
        200:
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_version: { type: integer, enum: [2] }
                  verdicts:
                    type: array
                    items:
                      anyOf:
                        - { $ref: "#/components/schemas/AttemptVerdict" }
                        - { $ref: "#/components/schemas/AttemptReceipt" }
        400:
          description: Invalid batch; v2 creates zero new rows
        409:
          description: Identity or session conflict; v2 creates zero new rows

  /sessions/{sessionId}/submit/:
    post:
      summary: Finalize a session and persist results
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [contract_version, expected_attempts]
                  properties:
                    contract_version: { type: integer, enum: [2] }
                    expected_attempts:
                      type: array
                      maxItems: 200
                      uniqueItems: true
                      description: Retain finish-time unresolved identities until submit is acknowledged.
                      items: { $ref: "#/components/schemas/AttemptIdentity" }
                - type: object
                  not: { required: [contract_version] }
      responses:
        200:
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressRecord" }
        409:
          description: Declared required identities missing, session abandoned, or mission_incomplete (five distinct accepted non-skip answers required); no new result or XP

  /sessions/{sessionId}/report/:
    get:
      summary: Get the detailed report for a completed session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionReport" }
        404:
          description: Session not found or not yet finalized
