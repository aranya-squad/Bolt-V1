name: Teacher verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  reporting-measurement:
    if: github.head_ref == 'feat/teacher-dashboard' || github.head_ref == 'feat/batch-level-assignment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bolt
          POSTGRES_PASSWORD: bolt
          POSTGRES_DB: bolt_teacher_benchmark
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: [5432:5432]
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: [6379:6379]
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: isolated-ci-only
      DATABASE_URL: postgres://bolt:bolt@localhost:5432/bolt_teacher_benchmark
      REPLICA_DATABASE_URL: ""
      REDIS_URL: redis://localhost:6379/15
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      BOLT_CLASSROOM_BENCHMARK: "1"
      BOLT_CLASSROOM_MEASUREMENT_LABEL: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - run: pip install -r requirements/development.txt
      - name: Create isolated stale replica for routing regressions
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['DATABASE_URL'], autocommit=True) as conn:
              conn.execute('CREATE DATABASE bolt_teacher_stale_replica')
          PY
      - name: Execute backend suite with genuine separate replica alias
        run: pytest --tb=short -q --junitxml=../teacher-backend-tests.xml
        env:
          DJANGO_SETTINGS_MODULE: apps.classroom.tests.verification_settings
          CLASSROOM_TEST_REPLICA_DATABASE_URL: postgres://bolt:bolt@localhost:5432/bolt_teacher_stale_replica
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teacher-backend-tests-${{ github.event.pull_request.head.sha }}
          path: teacher-backend-tests.xml
          if-no-files-found: error
          retention-days: 30
      - run: python manage.py migrate --noinput
      - name: Measure named head with rolled-back synthetic fixtures
        run: python -m apps.classroom.tests.benchmark_reporting ../teacher-reporting.json "${{ github.event.pull_request.head.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-reporting-${{ github.event.pull_request.head.sha }}
          path: teacher-reporting.json
          if-no-files-found: error
          retention-days: 30

  teacher-browser:
    if: github.head_ref == 'feat/teacher-dashboard' || github.head_ref == 'feat/batch-level-assignment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bolt
          POSTGRES_PASSWORD: bolt
          POSTGRES_DB: bolt_teacher_browser
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: [5432:5432]
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: [6379:6379]
    env:
      DJANGO_SETTINGS_MODULE: apps.classroom.tests.browser_settings
      DJANGO_SECRET_KEY: isolated-ci-browser-only
      DATABASE_URL: postgres://bolt:bolt@localhost:5432/bolt_teacher_browser
      REPLICA_DATABASE_URL: ""
      REDIS_URL: redis://localhost:6379/14
      TEACHER_E2E: "1"
      TEACHER_ASSIGNMENT_E2E: ${{ github.head_ref == 'feat/batch-level-assignment' && '1' || '0' }}
      TEACHER_API_ORIGIN: http://127.0.0.1:8012
      TEACHER_PREVIEW_ORIGIN: http://127.0.0.1:4182
      TEACHER_FIXTURE_FILE: ${{ github.workspace }}/teacher-fixtures.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements/development.txt
      - name: Migrate and seed synthetic real-auth browser data
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python -m apps.classroom.tests.seed_teacher_e2e > ../teacher-fixtures.json
      - name: Start isolated API
        working-directory: backend
        run: |
          python manage.py runserver 127.0.0.1:8012 --noreload > ../teacher-api.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8012/api/v1/health/', timeout=1)
                  break
              except Exception:
                  time.sleep(0.2)
          else:
              raise SystemExit('Isolated teacher API did not start')
          PY
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify built SPA against real API
        working-directory: frontend
        run: npx playwright test --config playwright.teacher.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: teacher-browser-failure-${{ github.event.pull_request.head.sha }}
          path: |
            teacher-api.log
            frontend/node_modules/.cache/teacher-results/
          retention-days: 7
