name: Teacher verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  reporting-measurement:
    if: github.head_ref == 'feat/teacher-dashboard' || github.head_ref == 'feat/batch-level-assignment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bolt
          POSTGRES_PASSWORD: bolt
          POSTGRES_DB: bolt_teacher_benchmark
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: [5432:5432]
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: [6379:6379]
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: isolated-ci-only
      DATABASE_URL: postgres://bolt:bolt@localhost:5432/bolt_teacher_benchmark
      REPLICA_DATABASE_URL: ""
      REDIS_URL: redis://localhost:6379/15
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      BOLT_CLASSROOM_BENCHMARK: "1"
      BOLT_CLASSROOM_MEASUREMENT_LABEL: baseline
      BOLT_CLASSROOM_RUNTIME_BASELINE_SHA: ec74cf3882b8a2dafc9f9c1e0d70e24c496364d0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - run: pip install -r requirements/development.txt
      - run: python manage.py migrate --noinput
      - name: Measure named head with rolled-back synthetic fixtures
        run: python -m apps.classroom.tests.benchmark_reporting ../teacher-reporting.json "${{ github.event.pull_request.head.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-reporting-${{ github.event.pull_request.head.sha }}
          path: teacher-reporting.json
          if-no-files-found: error
          retention-days: 30
